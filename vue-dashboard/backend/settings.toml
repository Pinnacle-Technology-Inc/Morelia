# Seconds before a "device read failing" warning is auto-cleared if we stop
# hearing updates about it. Raise this if healthy devices briefly look failed;
# lower it if recovered devices stay marked failed too long.
SOURCE_STATUS_STALE_AFTER_SECONDS = 3.0

# Full env-style names are also fine at the top level:
WATCHDOG_TIMEOUT_SECONDS = 10.0

[WATCHDOG]
FAILURE_THRESHOLD = 3
MAX_HEARTBEAT_AGE_SECONDS = 10.0
REPORT_INTERVAL_SECONDS = 3.0
STREAM_INTERVAL_SECONDS = 1.0
OPERATION_TIMEOUT_SECONDS = 5.0
DATAFLOW_STOP_TIMEOUT_SECONDS = 15.0
PROCESS_LOOP_INTERVAL_SECONDS = 1.0
TELEMETRY_TIMEOUT_SECONDS = 5.0
CONTROL_TIMEOUT_SECONDS = 2.0
PROCESS_STOP_TIMEOUT_SECONDS = 20.0
PROCESS_STOP_POLL_INTERVAL_SECONDS = 0.1
PROCESS_REAP_TIMEOUT_SECONDS = 5.0
PROCESS_LEGACY_STOP_TIMEOUT_SECONDS = 8.0
CONTROL_SERVER_STOP_TIMEOUT_SECONDS = 5.0
OUTBOX_BUSY_TIMEOUT_MILLISECONDS = 5000
THREAD_JOIN_GRACE_SECONDS = 1.0
TELEMETRY_STALE_AFTER_SECONDS = 10.0
TELEMETRY_OVERFLOW_AFTER_SECONDS = 60.0
STALE_AFTER_SECONDS = 10.0
RECOVERY_VERIFY_TIMEOUT_SECONDS = 5.0
RECOVERY_RETRY_DELAYS_SECONDS = [1, 2, 5, 10, 30, 60]
RESPAWN_MAX_ATTEMPTS = 3
STALE_GRACE_ATTEMPTS = 20

[RUNTIME_HOST]
STOP_DRAIN_TIMEOUT_SECONDS = 30.0
STOP_DRAIN_POLL_INTERVAL_SECONDS = 0.2
STATUS_PROBE_TIMEOUT_SECONDS = 2.0
PROCESS_WAIT_TIMEOUT_SECONDS = 5.0
SERVER_PUSH_TIMEOUT_SECONDS = 5.0
SERVER_STOP_TIMEOUT_SECONDS = 5.0
MAIN_LOOP_INTERVAL_SECONDS = 1.0

[CONTROL_PLANE]
POLL_INTERVAL_SECONDS = 1.0
DELAYED_AFTER_SECONDS = 5.0
UNREACHABLE_AFTER_SECONDS = 15.0
POLLER_STOP_TIMEOUT_SECONDS = 5.0

[SSE]
POLL_INTERVAL = 2
HEARTBEAT_INTERVAL = 15
